<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="author" content="{{ config.extra.author }}">
  <link rel="icon" href="{{ get_url(path='images/brand/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="{{ get_url(path='@/_index.md') }}" class="logo">
        <svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2.25"/>
          <path d="M18 34 L32 16 L46 34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M24 34 L32 22 L40 34 Z" fill="currentColor"/>
          <line x1="14" y1="38" x2="50" y2="38" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
          <line x1="20" y1="44" x2="44" y2="44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="26" y1="49.5" x2="38" y2="49.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">tashi<span class="logo-domain">.engineer</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="{{ get_url(path='@/_index.md') }}">Home</a></li>
        <li><a href="{{ get_url(path='@/about.md') }}">About</a></li>
        <li><a href="{{ get_url(path='@/projects/_index.md') }}">Projects</a></li>
        <li><a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a></li>
        <li><a href="{{ get_url(path='@/resume.md') }}">Resume</a></li>
        <li><a href="{{ get_url(path='@/contact.md') }}">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© {{ now() | date(format="%Y") }} {{ config.extra.author }} · {{ config.extra.location }}</p>
      <div class="footer-links">
        <a href="{{ config.extra.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ config.extra.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="mailto:{{ config.extra.email }}">Email</a>
      </div>
    </div>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    if (toggle && links) {
      toggle.addEventListener('click', () => links.classList.toggle('open'));
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
